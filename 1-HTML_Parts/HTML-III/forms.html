<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML part-III</title>
</head>
<body>
    <form action = "/action.php">

        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" placeholder="Enter Username"/>
            <br>
            <label for="password">password:</label>
            <input type="password" id="password" placeholder="password" />
        </div>



        <div>
           
            <label for="check18" name="age">I am 18+</label>
            <input type="checkbox" id="check18"/>
        </div>

        <div>
            <input type="radio" name="fruit" id="apple" value="apple"/>
            <label for="apple">Apple</label>

            <input type="radio" name="fruit" id="banana" value="banana"/>
            <label for="banana">banana</label>

            <input type="radio" name="fruit" id="mango" value="mango"/>
            <label for="mango">mango</label>
        </div>

        <div>
            Choose your Profession:
            <select name="prof" id="profession">
                <option value="stu">Student</option>
                <option value="dev">Developer</option>
                <option value="test">Tester</option>
            </select>
        </div>
        <button>Submit</button>
    </form>
</body>
</html>
